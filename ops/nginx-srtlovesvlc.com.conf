# srtlovesvlc.com — static Vite/React marketing site.
# Deploy dist/ to /var/www/srtlovesvlc.com (ops/deploy.sh).
# After public DNS A/AAAA point here, run:
#   certbot --nginx -d srtlovesvlc.com -d www.srtlovesvlc.com
# Certbot will add listen 443 ssl blocks and the HTTP→HTTPS redirect.

# www -> apex (canonical) 301
server {
    listen 80;
    listen [::]:80;
    server_name www.srtlovesvlc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://srtlovesvlc.com$request_uri;
}

# apex: serves the site
server {
    listen 80;
    listen [::]:80;
    server_name srtlovesvlc.com;

    root /var/www/srtlovesvlc.com;
    index index.html;

    access_log /var/log/nginx/srtlovesvlc.com.access.log;
    error_log  /var/log/nginx/srtlovesvlc.com.error.log;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # private fulfillment files: never fall back to the SPA, never index
    location /downloads/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # hashed Vite assets: long cache
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
